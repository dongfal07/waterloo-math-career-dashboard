name: Waterloo Math Career 24/7 Daily Telegram Alert

on:
  schedule:
    # 매일 한국 시간 오전 09:00 (UTC 00:00) 에 실시간 공고 동기화 및 D-Day 전체 일정 브리핑
    - cron: '0 0 * * *'
    # 매주 월요일 한국 시간 오전 10:00 (UTC 01:00) 에 실시간 크롤링 인턴십 종합 공고 발송
    - cron: '0 1 * * 1'
  workflow_dispatch: # 웹에서 즉시 수동 실행 지원
    inputs:
      alert_type:
        description: '발송할 알림 종류 (dday / jobs / all)'
        required: false
        default: 'all'

concurrency:
  group: telegram-alert-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Crawl Live Internships & Sync Official Waterloo Schedule
        run: python scripts/live_crawler.py

      - name: Auto-Commit Updated Live Data for GitHub Pages Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internship_postings.json data/waterloo_math_profile.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync live North American internships and official Waterloo schedule" && git push)

      - name: Send Full D-Day Schedule Alert (Daily 09:00 KST or Manual)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.alert_type == 'dday' || inputs.alert_type == 'all' || inputs.alert_type == ''))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notifier.py --dday

      - name: Send Live Crawled Job Postings (Monday 10:00 KST or Manual)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1') ||
          (github.event_name == 'workflow_dispatch' && (inputs.alert_type == 'jobs' || inputs.alert_type == 'all'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notifier.py --jobs
