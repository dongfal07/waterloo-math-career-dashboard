<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070A12">
  <title>Waterloo Math 2028 Career Intelligence</title>

  <link rel="icon" type="image/svg+xml" href="web/assets/icon.svg">
  <link rel="apple-touch-icon" href="web/assets/icon.svg">
  <link rel="manifest" href="manifest.json">

  <script>
    // PC 와이드 화면(1024px 이상)에서 단독 접속 시 데스크톱 와이드 대시보드로 자동 분기 (?view=mobile 예외 보장)
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const forceMobile = urlParams.get('view') === 'mobile';
      if (window.innerWidth >= 1024 && !forceMobile && window.self === window.top) {
        let base = window.location.href.split('?')[0].split('#')[0];
        if (base.endsWith('/index.html')) {
          base = base.slice(0, -'index.html'.length);
        } else if (!base.endsWith('/')) {
          base += '/';
        }
        window.location.replace(base + 'web/desktop_dashboard.html' + window.location.search);
      }
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Official Kakao JavaScript SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            uwGold: '#F5C518',
            uwGoldHover: '#EAB308',
            mathPink: '#EC4899',
            uwCanvas: '#070A12',
            uwSurface: '#0F1523',
            uwElevated: '#161F33'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="web/assets/uw-theme.css">
</head>
<body
  data-entry="root"
  data-data-prefix="./data"
  data-asset-prefix="web/assets"

  <div id="uw-mobile-root"></div>

  <script src="web/assets/uw-core.js"></script>
